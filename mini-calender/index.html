<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Premium Mini Calendar</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="calendar">
      <div class="left">
        <p id="date"></p>
        <p id="day"></p>
      </div>

      <div class="right">
        <p id="month"></p>
        <p id="year"></p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- START SCREEN -->
      <div class="screen active" id="start-screen">
        <h1>Quiz Time!</h1>
        <p>Test your knowledge with fun questions</p>
        <button>Start Quiz</button>
      </div>
      <!-- QUIZ SCREEN -->
      <div class="screen" id="quiz-screen">
        <div class="quiz-header">
          <h2 id="question-text">Quetion</h2>
          <div class="quiz-info">
            <p>
              Quetion <span class="current-quetion">1</span> of <span>5</span>
            </p>
            <p>Score: <span class="score">0</span></p>
          </div>
        </div>
        <div id="answers-container" class="answers-container"></div>
        <div class="progress-bar">
          <div class="progress" class="progress"></div>
        </div>
      </div>
      <!-- RESULT SCREEN -->
      <div id="result-screen" class="screen">
        <h1>Quiz Results</h1>
        <div class="result-info">
          <p>
            You scored <span id="final-score">0</span> out of
            <span id="max-score">5</span>
          </p>
          <div id="result-message">Good Job</div>
        </div>
        <button id="restart-btn">Restart Quiz</button>
      </div>
    </div>
  </body>
</html>
